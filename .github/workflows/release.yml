name: Build and Release

# Trigger on pushes to master branch
on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        env:
          KOLBO_ENV: production
        run: |
          # Use --publish never to prevent electron-builder from publishing to GitHub
          # The workflow handles uploading to the release instead
          node build-env.js
          npx electron-builder --win --publish never

      - name: Fix filename format in latest.yml
        shell: bash
        run: |
          sed -i 's/Kolbo-Studio/Kolbo.Studio/g' dist/latest.yml
          cat dist/latest.yml

      - name: Copy installer with fixed "latest" filename
        shell: bash
        run: |
          cp "dist/Kolbo Studio-Setup-${{ needs.prepare-release.outputs.version }}.exe" "dist/Kolbo.Studio-Setup-latest.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/Kolbo Studio-Setup-${{ needs.prepare-release.outputs.version }}.exe
            dist/Kolbo Studio-Setup-${{ needs.prepare-release.outputs.version }}.exe.blockmap
            dist/latest.yml
            dist/Kolbo.Studio-Setup-latest.exe

  build-macos:
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Generate Mac icon with rounded corners
        run: node scripts/generate-icons.js

      - name: Import Code Signing Certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "⚠️ CSC_LINK not set, skipping certificate import"
            exit 0
          fi

          # Create a temporary keychain
          KEYCHAIN_NAME="build.keychain"
          KEYCHAIN_PASSWORD="actions"

          # Decode certificate
          echo "$CSC_LINK" | base64 --decode > certificate.p12

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security default-keychain -s "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_NAME"

          # Import certificate
          security import certificate.p12 -k "$KEYCHAIN_NAME" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          # Add to keychain search list
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')

          # Verify certificate imported
          echo "=== Installed identities ==="
          security find-identity -v -p codesigning

          # Clean up
          rm certificate.p12

      - name: Build macOS DMG
        env:
          KOLBO_ENV: production
          # Code signing - explicitly specify the certificate identity
          CSC_NAME: "Zohar Vanunu Productions, LLC (DPVW9Z2L9Y)"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization credentials (both variable names for compatibility)
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          echo "=== Starting Mac build ==="
          # Use --publish never to prevent electron-builder from publishing to GitHub
          # The workflow handles uploading to the release instead
          node build-env.js
          npx electron-builder --mac --publish never
          BUILD_EXIT_CODE=$?
          echo "=== Build exit code: $BUILD_EXIT_CODE ==="
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Mac build failed with exit code $BUILD_EXIT_CODE"
            exit $BUILD_EXIT_CODE
          fi
          echo "✅ Mac build completed successfully"
          
          # Verify the signature
          echo "=== Verifying code signature ==="
          APP_PATH=$(find dist/mac-universal -name "*.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            codesign -dv --verbose=2 "$APP_PATH" || echo "⚠️  Signature verification info"
            spctl --assess --verbose "$APP_PATH" 2>&1 || echo "⚠️  Gatekeeper check (notarization required for full pass)"
          else
            echo "⚠️  App not found in dist/mac-universal"
            ls -la dist/ || true
          fi

      - name: Fix filename format in latest-mac.yml
        shell: bash
        run: |
          echo "=== Original latest-mac.yml ==="
          cat dist/latest-mac.yml
          # CRITICAL: GitHub converts spaces to dots in uploaded filenames
          # Must use dots (Kolbo.Studio) not spaces (Kolbo Studio) to match GitHub's actual files
          # Replace dashes with DOTS: Kolbo-Studio -> Kolbo.Studio
          # macOS sed requires -i '' (empty backup extension)
          sed -i '' 's/Kolbo-Studio/Kolbo.Studio/g' dist/latest-mac.yml
          # Remove -mac suffix from ZIP filenames for universal builds
          sed -i '' 's/-universal-mac\.zip/-universal.zip/g' dist/latest-mac.yml
          echo "=== Fixed latest-mac.yml ==="
          cat dist/latest-mac.yml

      - name: Debug - List Mac dist files
        run: |
          echo "=== Contents of dist directory ==="
          ls -lah dist/ || echo "dist directory not found"
          echo "=== Looking for DMG files ==="
          find dist/ -name "*.dmg" -o -name "*.zip" -o -name "*.yml" || echo "No matching files found"

      - name: Copy DMG with fixed "latest" filename
        run: |
          cp "dist/Kolbo Studio-${{ needs.prepare-release.outputs.version }}-universal.dmg" "dist/Kolbo.Studio-latest.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/Kolbo Studio-${{ needs.prepare-release.outputs.version }}-universal.dmg
            dist/Kolbo Studio-${{ needs.prepare-release.outputs.version }}-universal-mac.zip
            dist/latest-mac.yml
            dist/Kolbo.Studio-latest.dmg

  create-release:
    needs: [prepare-release, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: ./dist-windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: ./dist-macos

      # ⚠️ CRITICAL: DO NOT RENAME FILES! ⚠️
      # GitHub automatically converts spaces to dots in uploaded filenames:
      # "Kolbo Studio-Setup-1.0.2.exe" becomes "Kolbo.Studio-Setup-1.0.2.exe"
      #
      # The app code (main.js) expects filenames with DOTS to match GitHub's behavior.
      # If you rename files here (e.g., spaces->dashes), it will break auto-updates
      # for ALL existing users because their app expects the dot notation.
      #
      # The latest.yml file created by electron-builder will have the original
      # filename with spaces, but when users download from GitHub, spaces become dots.
      # This is expected and correct behavior - DO NOT "fix" it!

      - name: Validate filenames before consolidation
        run: |
          echo "=== Validating Windows artifacts ==="
          ls ./dist-windows/
          if ! ls ./dist-windows/ | grep -q "Kolbo Studio-Setup"; then
            echo "❌ ERROR: Windows installer not found with expected 'Kolbo Studio-Setup' name"
            exit 1
          fi
          if ! ls ./dist-windows/latest.yml >/dev/null 2>&1; then
            echo "❌ ERROR: latest.yml not found in Windows artifacts"
            exit 1
          fi

          echo "=== Validating Mac artifacts ==="
          ls ./dist-macos/
          if ! ls ./dist-macos/ | grep -q "Kolbo Studio-.*-universal\.dmg"; then
            echo "❌ ERROR: Mac universal DMG not found"
            exit 1
          fi
          if ! ls ./dist-macos/ | grep -q "Kolbo Studio-.*-universal-mac\.zip"; then
            echo "❌ ERROR: Mac universal ZIP not found"
            exit 1
          fi
          if ! ls ./dist-macos/latest-mac.yml >/dev/null 2>&1; then
            echo "❌ ERROR: latest-mac.yml not found in Mac artifacts"
            exit 1
          fi

          echo "✅ All filenames validated successfully"

      # Mac files are created with -mac suffix for ZIPs (e.g., universal-mac.zip).
      # We rename to remove -mac suffix to match what the app expects.
      - name: Rename Mac ZIP files to remove -mac suffix
        run: |
          echo "=== Renaming Mac ZIP files ==="
          cd ./dist-macos
          # Rename universal ZIP: remove -mac suffix
          if [ -f "Kolbo Studio-${{ needs.prepare-release.outputs.version }}-universal-mac.zip" ]; then
            mv "Kolbo Studio-${{ needs.prepare-release.outputs.version }}-universal-mac.zip" "Kolbo Studio-${{ needs.prepare-release.outputs.version }}-universal.zip"
            echo "✅ Renamed universal ZIP file"
          fi
          # DMG files don't need renaming - they're already correct
          echo "=== Mac files after rename ==="
          ls -lah
          cd ..

      - name: Consolidate all artifacts into single directory
        run: |
          mkdir -p ./release-artifacts
          cp -v ./dist-windows/* ./release-artifacts/
          cp -v ./dist-macos/* ./release-artifacts/
          echo "=== Final artifacts to upload ==="
          ls -lah ./release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: Kolbo Studio v${{ needs.prepare-release.outputs.version }}
          body: |
            ## Kolbo Studio v${{ needs.prepare-release.outputs.version }}

            ### Downloads
            - **Windows**: Kolbo.Studio-Setup-${{ needs.prepare-release.outputs.version }}.exe
            - **macOS (Universal)**: Kolbo.Studio-${{ needs.prepare-release.outputs.version }}.dmg (works on both Intel and Apple Silicon)

            ### Installation
            **Windows**: Download the .exe installer and run it. Follow the setup wizard.

            **macOS**: Download the .dmg file. It's a universal binary that works on both Intel and Apple Silicon Macs. Open the DMG and drag Kolbo Studio to Applications.

            ### Auto-Update
            Existing users will be notified automatically within the app. Click "Download Update" to get the latest version.

            ---
            🚀 **Auto-generated release from master branch**
          draft: false
          prerelease: false
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
