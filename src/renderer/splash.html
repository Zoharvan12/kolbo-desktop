<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo {
      width: 120px;
      height: auto;
      opacity: 0;
      animation: fadeIn 0.5s ease 0.1s forwards;
    }

    .dot-row {
      display: flex;
      gap: 8px;
      margin-top: 40px;
      opacity: 0;
      animation: fadeIn 0.5s ease 0.4s forwards;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #333;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { background: #333; transform: scale(1); }
      50%       { background: #888; transform: scale(1.4); }
    }
  </style>
</head>
<body>
  <img class="logo" src="../../assets/images/SVG/kolbo-svg-white.svg" alt="Kolbo" />
  <div class="dot-row">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
